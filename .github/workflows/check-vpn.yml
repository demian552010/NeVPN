name: Проверка VPN-конфигов

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:         # ручной запуск

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # нужно для пуша изменений

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Запуск скрипта проверки
        run: python scripts/check_vpn.py

      - name: Коммит и пуш изменений
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working_configs.txt
          git diff --staged --quiet || git commit -m "Автообновление списка рабочих конфигов $(date +'%Y-%m-%d %H:%M')"
          git push
